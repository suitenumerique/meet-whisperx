[project]
name = "whisper-openai-api"
version = "1.2.0"
description = "Whisper OpenAI API"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai==2.41.0",
    "uvicorn==0.49.0",
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "pydantic-settings==2.14.1",
]

[dependency-groups]
# Heavy libraries used for inference (not required for local API dev)
inference = [
#    "torch==2.12.0",
#    "torchaudio==2.11.0",
#    "transformers<5.0",
"endpoints",
    "whisperx==3.8.6",
#    "matplotlib==3.10.9",
#    "onnxruntime<1.24",  # 1.24+ dropped Python 3.10 wheels
]
# Helper libraries for dev
dev = [
    "ruff==0.15.16",
    "pre-commit==3.6.2",
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pip-audit",
]

[tool.uv]
# Pins for transitive deps with known vulnerabilities
constraint-dependencies = [
    "nltk>=3.9.3",  # Fixes arbitrary code execution in downloader
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["F403", "F841"] # import * and never used variables

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["utils", "schemas", "endpoints"]
forced-separate = ["tests"]

[tool.ruff.lint.isort.sections]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pytest.ini_options]
addopts = "--exitfirst --log-cli-level=INFO"
testpaths = ["app/tests"]
minversion = "8.2.2"